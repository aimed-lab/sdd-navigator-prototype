<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SDD Navigator | Knowledge Graph</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Hanken+Grotesk:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @keyframes status-pulse {
            0% { box-shadow: 0 0 0 0px rgba(0, 245, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 245, 255, 0); }
            100% { box-shadow: 0 0 0 0px rgba(0, 245, 255, 0); }
        }
        .animate-status-pulse {
            animation: status-pulse 2s infinite;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .graph-bg {
            background: radial-gradient(circle at 50% 50%, #161b2b 0%, #0e1322 100%);
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }
        .node-episode { color: #00dce5; filter: drop-shadow(0 0 10px #00dce5); }
        .node-concept { color: #4ade80; filter: drop-shadow(0 0 8px #4ade80); }
        .node-resource { color: #c084fc; filter: drop-shadow(0 0 6px #c084fc); }
        
        #graph-canvas {
            cursor: grab;
        }
        #graph-canvas:active {
            cursor: grabbing;
        }

        .modal-overlay {
            background: rgba(9, 14, 28, 0.8);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
    </style>

                        "tertiary-container": "#d3dcff",
                        "status-pulse": "#00f5ff",
                        "secondary": "#d1bcff",
                        "primary-fixed-dim": "#00dce5",
                        "error-container": "#93000a",
                        "tertiary": "#faf9ff",
                        "on-surface": "#dee1f7",
                        "secondary-container": "#7000ff",
                        "primary": "#e9feff",
                        "surface-variant": "#2f3445",
                        "secondary-fixed": "#e9ddff",
                        "inverse-primary": "#00696e",
                        "surface-container": "#1a1f2f",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#25293a",
                        "on-tertiary-fixed-variant": "#003fa4",
                        "primary-fixed": "#63f7ff",
                        "primary-container": "#00f5ff",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#004f53",
                        "secondary-fixed-dim": "#d1bcff",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                        "on-secondary-container": "#ddcdff",
                        "on-tertiary": "#002b75",
                        "inverse-on-surface": "#2b3040",
                        "data-mono": "#94a3b8",
                        "background": "#0e1322",
                        "outline-variant": "#3a494a",
                        "surface-container-highest": "#2f3445",
                        "on-surface-variant": "#b9caca",
                        "on-background": "#dee1f7",
                        "surface-dim": "#0e1322",
                        "tertiary-fixed": "#dae1ff",
                        "on-primary-container": "#006c71",
                        "surface": "#0e1322",
                        "on-primary": "#003739",
                        "surface-container-low": "#161b2b",
                        "surface-bright": "#343949",
                        "tertiary-fixed-dim": "#b3c5ff",
                        "glass-surface": "rgba(255, 255, 255, 0.03)",
                        "surface-tint": "#00dce5",
                        "on-secondary-fixed-variant": "#5700c9",
                        "surface-container-lowest": "#090e1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "max-width": "1440px",
                        "gutter": "24px",
                        "margin-desktop": "64px",

                        "body-md": ["Inter"],

                    "fontSize": {

                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar Shell -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-desktop h-20 max-w-max-width mx-auto bg-glass-surface backdrop-blur-xl border-b border-glass-border shadow-sm">
<div class="flex items-center gap-12">
<div class="font-headline-lg text-headline-lg font-bold text-primary tracking-tight">SDD Navigator</div>
<nav class="hidden md:flex gap-8">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Home</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Knowledge Hub</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Navigator</a>
<a class="font-body-md text-body-md text-primary border-b-2 border-primary pb-1" href="#">Graph</a>

</div>
<div class="flex items-center gap-4">
<div class="relative group">

<!-- Main Content: Knowledge Graph Canvas -->
<main class="relative w-screen h-screen graph-bg overflow-hidden pt-20">
<!-- SVG Visualization Layer -->

<svg class="w-full h-full" id="graph-canvas" viewbox="0 0 1440 800">
<!-- Hierarchy: Episode (Root) -> Concept -> Resource -->
<g id="links">
<!-- Links from Episodes to Concepts -->
<line stroke="rgba(255,255,255,0.08)" stroke-width="1.5" x1="720" x2="400" y1="400" y2="250"></line>
<line stroke="rgba(255,255,255,0.08)" stroke-width="1.5" x1="720" x2="1040" y1="400" y2="250"></line>
<line stroke="rgba(255,255,255,0.08)" stroke-width="1.5" x1="720" x2="720" y1="400" y2="150"></line>
<line stroke="rgba(255,255,255,0.08)" stroke-width="1.5" x1="720" x2="400" y1="400" y2="550"></line>
<line stroke="rgba(255,255,255,0.08)" stroke-width="1.5" x1="720" x2="1040" y1="400" y2="550"></line>
<line stroke="rgba(255,255,255,0.08)" stroke-width="1.5" x1="720" x2="720" y1="400" y2="650"></line>
<!-- Links from Concepts to Resources -->
<line stroke="rgba(255,255,255,0.05)" stroke-dasharray="4" stroke-width="1" x1="400" x2="250" y1="250" y2="200"></line>

<line stroke="rgba(255,255,255,0.05)" stroke-dasharray="4" stroke-width="1" x1="720" x2="850" y1="650" y2="720"></line>
</g>

<!-- Episode Node (Large) -->

<circle class="node-episode animate-status-pulse" fill="currentColor" r="14"></circle>
<text class="font-data-label text-[11px] fill-on-surface-variant font-bold" text-anchor="middle" y="32">Episode 42</text>
</g>
<!-- Concept Nodes (Medium) -->
<g class="cursor-pointer node-group" onclick="openNodeModal('concept', 'Digital Twins', {mentions: ['Ep 42', 'Ep 45']})" transform="translate(400, 250)">
<circle class="node-concept" fill="currentColor" r="9"></circle>
<text class="font-data-label text-[10px] fill-on-surface-variant" text-anchor="middle" y="24">Digital Twins</text>
</g>
<g class="cursor-pointer node-group" onclick="openNodeModal('concept', 'ADMET', {mentions: ['Ep 12', 'Ep 24']})" transform="translate(1040, 250)">

</g>
<g class="cursor-pointer node-group" onclick="openNodeModal('concept', 'Virtual Patients', {mentions: ['Ep 38']})" transform="translate(720, 150)">

</g>
<g class="cursor-pointer node-group" onclick="openNodeModal('concept', 'EMA Regulations', {mentions: ['Ep 05', 'Ep 42']})" transform="translate(400, 550)">

<text class="font-data-label text-[10px] fill-on-surface-variant" text-anchor="middle" y="24">EMA Regulations</text>
</g>
<g class="cursor-pointer node-group" onclick="openNodeModal('concept', 'AlphaFold', {mentions: ['Ep 19', 'Ep 51']})" transform="translate(1040, 550)">
<circle class="node-concept" fill="currentColor" r="9"></circle>
<text class="font-data-label text-[10px] fill-on-surface-variant" text-anchor="middle" y="24">AlphaFold</text>
</g>
<g class="cursor-pointer node-group" onclick="openNodeModal('concept', 'Molecular Docking', {mentions: ['Ep 21']})" transform="translate(720, 650)">

<!-- Resource Nodes (Small) -->
<g class="cursor-pointer node-group" onclick="openNodeModal('resource', 'Nature 2024: Digital Twin Trial', {meta: 'Dr. Sarah Chen et al. | Nature Med | Oct 2024', abstract: 'A comprehensive study on the validation of digital twin cohorts in oncology phase III trials across 12 global sites.'})" transform="translate(250, 200)">

<g class="cursor-pointer node-group" onclick="openNodeModal('resource', 'bioRxiv: Multi-Agent Drug Discovery', {meta: 'Miller et al. | bioRxiv | 2024', abstract: 'Preliminary findings on decentralized intelligence for lead optimization in rare disease therapy development.'})" transform="translate(850, 720)">
<circle class="node-resource" fill="currentColor" r="6"></circle>
<text class="font-data-label text-[9px] fill-on-surface-variant" text-anchor="middle" y="18">bioRxiv: Multi-Agent</text>
</g>
</g>

<!-- Legend (Bottom Left) -->

<div class="font-data-label text-data-label text-on-surface-variant uppercase tracking-widest border-b border-glass-border pb-2 mb-2">Entity Legend</div>
<div class="flex items-center gap-3">
<span class="w-4 h-4 rounded-full bg-primary-fixed-dim shadow-[0_0_8px_#00dce5]"></span>

</div>

</div>

<span class="w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_8px_#c084fc]"></span>

<!-- Footer -->

<div class="font-headline-lg text-headline-lg text-on-surface opacity-80">SDD Navigator</div>
<div class="flex gap-8">
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Hub</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Navigator</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Graph</a>

<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Contact</a>
</div>
<div class="text-on-surface-variant text-sm font-data-label opacity-60">

    </div>
</footer>
<script>
    function openNodeModal(type, title, data) {
        const overlay = document.getElementById('modal-overlay');
        const body = document.getElementById('modal-body');
        let html = '';

        if (type === 'episode') {
            html = `
                <div class="flex flex-col gap-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-data-label text-[11px] text-primary-fixed-dim bg-primary/10 px-2 py-1 rounded mb-2 inline-block uppercase tracking-wider">Episode #${data.episode}</span>
                            <h2 class="font-headline-lg text-headline-lg text-primary leading-tight">${title}</h2>
                        </div>
                        <button onclick="closeNodeModal()" class="text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${data.tags.map(tag => `<span class="bg-surface-container-high px-3 py-1 rounded-full text-[11px] font-data-label text-on-surface border border-glass-border">${tag}</span>`).join('')}
                    </div>
                    <p class="text-on-surface-variant leading-relaxed text-sm">${data.desc}</p>
                    <div class="flex gap-3 mt-4">
                        <button class="flex-grow bg-primary-container text-on-primary-container font-data-label text-sm font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:brightness-110 transition-all">
                            Open Wiki Page <span class="material-symbols-outlined text-[18px]">open_in_new</span>
                        </button>
                        <button onclick="closeNodeModal()" class="px-6 py-3 border border-glass-border rounded-lg text-on-surface-variant hover:bg-white/5 transition-colors font-data-label text-sm">Close</button>
                    </div>
                </div>
            `;
        } else if (type === 'concept') {
            html = `
                <div class="flex flex-col gap-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-data-label text-[11px] text-green-400 bg-green-400/10 px-2 py-1 rounded mb-2 inline-block uppercase tracking-wider">Scientific Concept</span>
                            <h2 class="font-headline-lg text-headline-lg text-green-400 leading-tight">${title}</h2>
                        </div>
                        <button onclick="closeNodeModal()" class="text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div>
                        <p class="font-data-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-3">Mentioned in Episodes</p>
                        <div class="flex flex-wrap gap-2">
                            ${data.mentions.map(m => `<button class="bg-surface-container-low hover:bg-surface-container-high px-4 py-2 rounded-lg text-xs border border-glass-border transition-colors">${m}</button>`).join('')}
                        </div>
                    </div>
                    <div class="flex gap-3 mt-4">
                        <button class="flex-grow bg-green-400/20 text-green-400 border border-green-400/30 font-data-label text-sm font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-green-400/30 transition-all">
                            View Related Episodes <span class="material-symbols-outlined text-[18px]">hub</span>
                        </button>
                        <button onclick="closeNodeModal()" class="px-6 py-3 border border-glass-border rounded-lg text-on-surface-variant hover:bg-white/5 transition-colors font-data-label text-sm">Close</button>
                    </div>
                </div>
            `;
        } else if (type === 'resource') {
            html = `
                <div class="flex flex-col gap-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-data-label text-[11px] text-purple-400 bg-purple-400/10 px-2 py-1 rounded mb-2 inline-block uppercase tracking-wider">Research Artifact</span>
                            <h2 class="font-headline-lg text-2xl text-on-surface leading-tight">${title}</h2>
                        </div>
                        <button onclick="closeNodeModal()" class="text-on-surface-variant hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <div class="text-purple-400/80 font-data-label text-[11px] leading-snug">
                        ${data.meta}
                    </div>
                    <div class="relative">
                        <p class="font-data-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-2">Abstract</p>
                        <p class="text-on-surface-variant text-sm line-clamp-2 italic">"${data.abstract}"</p>
                    </div>
                    <div class="flex gap-3 mt-4">
                        <button class="flex-grow bg-purple-400/20 text-purple-400 border border-purple-400/30 font-data-label text-sm font-bold py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-purple-400/30 transition-all">
                            Read Full Paper <span class="material-symbols-outlined text-[18px]">article</span>
                        </button>
                        <button onclick="closeNodeModal()" class="px-6 py-3 border border-glass-border rounded-lg text-on-surface-variant hover:bg-white/5 transition-colors font-data-label text-sm">Close</button>
                    </div>
                </div>
            `;
        }

        body.innerHTML = html;
        overlay.classList.add('active');
    }

    function closeNodeModal(e) {
        document.getElementById('modal-overlay').classList.remove('active');
    }

    // Lightweight zoom/pan simulation logic
    const graphCanvas = document.getElementById('graph-canvas');
    let isDragging = false;
    let startPos = { x: 0, y: 0 };
    let scrollPos = { x: 0, y: 0 };

    graphCanvas.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node-group')) return;
        isDragging = true;
        startPos = { x: e.clientX, y: e.clientY };
        const viewBox = graphCanvas.getAttribute('viewBox') || '0 0 1440 800';
        const parts = viewBox.split(' ').map(Number);
        scrollPos = { x: parts[0], y: parts[1] };
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startPos.x;
        const dy = e.clientY - startPos.y;
        const newX = scrollPos.x - dx;
        const newY = scrollPos.y - dy;
        graphCanvas.setAttribute('viewBox', `${newX} ${newY} 1440 800`);
    });

    // Dynamic background particle effect simulation
    const container = document.getElementById('graph-container');
    container.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        container.style.backgroundPosition = `${x * 10}px ${y * 10}px`;
    });
</script>
</body></html>
